version: 2

updates:
  # Python (uv.lock + pyproject.toml)
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  # Node workspaces (client, tui, web). One root lockfile, so one entry at /.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  # Base images in deploy/*.Dockerfile (python, uv)
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
      day: monday

  # Images in deploy/docker-compose.yml (caddy)
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
