name: release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Check the tag matches every package version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/plural/__init__.py)
          test "v${version}" = "${GITHUB_REF_NAME}"
          test "$(node -p "require('./tui/package.json').version")" = "${version}"
      - run: uv sync --frozen
      - run: uv run pytest
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  binaries:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: darwin, arch: arm64, target: bun-darwin-arm64 }
          - { os: darwin, arch: x64, target: bun-darwin-x64 }
          - { os: linux, arch: x64, target: bun-linux-x64 }
          - { os: linux, arch: arm64, target: bun-linux-arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the native renderer for every platform
        run: sh scripts/install-native-renderer.sh
      - name: Compile the client
        run: |
          mkdir -p stage
          npx --workspace tui bun build src/cli.tsx --compile --target=${{ matrix.target }} --outfile ../stage/plural
      - name: Smoke test
        if: matrix.os == 'linux' && matrix.arch == 'x64'
        run: |
          ./stage/plural --version
          script -qec "timeout 30 ./stage/plural --selftest" /dev/null
      - name: Package
        run: |
          name=plural-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          tar -czf "$name" -C stage plural
          sha256sum "$name" > "$name.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            plural-*.tar.gz
            plural-*.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [publish, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets/
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: assets/*
          generate_release_notes: true
