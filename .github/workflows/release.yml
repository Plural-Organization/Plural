name: release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Require a green ci run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          green=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [ "$green" -lt 1 ]; then
            echo "::error::ci has no green run for $GITHUB_SHA. Wait for it to pass on this commit, then run this workflow again"
            exit 1
          fi
      - name: Check the tag matches every package version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/plural/__init__.py)
          test "v${version}" = "${GITHUB_REF_NAME}"
          test "$(node -p "require('./tui/package.json').version")" = "${version}"
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  binaries:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: darwin, arch: arm64, target: bun-darwin-arm64 }
          - { os: darwin, arch: x64, target: bun-darwin-x64 }
          - { os: linux, arch: x64, target: bun-linux-x64 }
          - { os: linux, arch: arm64, target: bun-linux-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the native renderer for every platform
        run: sh scripts/install-native-renderer.sh
      - name: Compile the client
        run: |
          mkdir -p stage
          npx --workspace tui bun build src/cli.tsx --compile --target=${{ matrix.target }} --outfile ../stage/plural
      - name: Smoke test
        if: matrix.os == 'linux' && matrix.arch == 'x64'
        run: |
          ./stage/plural --version
          script -qec "timeout 30 ./stage/plural --selftest" /dev/null
      - name: Package
        run: |
          base=plural-${{ matrix.os }}-${{ matrix.arch }}
          # The xz archive is a third smaller than gzip (the Bun runtime is most of the binary),
          # which is what a slow connection waits for. The gzip one stays for hosts without xz
          # and for installers older than the xz archive.
          tar -cf - -C stage plural | xz -9e -T0 > "$base.tar.xz"
          tar -czf "$base.tar.gz" -C stage plural
          sha256sum "$base.tar.xz" > "$base.tar.xz.sha256"
          sha256sum "$base.tar.gz" > "$base.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            plural-*.tar.xz
            plural-*.tar.xz.sha256
            plural-*.tar.gz
            plural-*.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [publish, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets/
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
