name: security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly, catches new advisories on unchanged code

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # New or changed dependencies in a PR: known vulns and license problems.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  # Both lockfiles (uv.lock, package-lock.json) against OSV.dev.
  osv-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan lockfiles
        run: |
          docker run --rm -v "$PWD:/src:ro" ghcr.io/google/osv-scanner:latest \
            scan source --recursive /src

  # Node side. The Python side is already covered by pip-audit in ci.yml.
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high

  # The two deployed images (relay, host).
  docker-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [relay, host]
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f deploy/${{ matrix.image }}.Dockerfile -t plural-${{ matrix.image }}:ci .
      - name: Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            plural-${{ matrix.image }}:ci

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  scorecard:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
