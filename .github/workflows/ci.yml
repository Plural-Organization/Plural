name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run python scripts/gen_schema.py --check
      - run: uv run python scripts/gen_fixtures.py --check
      - run: uv run coverage run -m pytest && uv run coverage report
      - run: uv run pip-audit


  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run gen --workspace client
      - run: git diff --exit-code client/src/protocol
      - run: npm run typecheck --workspace client
      - run: npm test --workspace client
      - run: npm run typecheck --workspace tui
      - run: npm test --workspace tui
      - run: npm run typecheck --workspace web
      - run: npm test --workspace web
      - run: npm run build --workspace web
      - run: sh scripts/install-native-renderer.sh
      - run: npm run build --workspace tui
      - name: Start the compiled client in a pseudo terminal
        run: script -qec "timeout 30 ./dist-bin/plural --selftest" /dev/null
